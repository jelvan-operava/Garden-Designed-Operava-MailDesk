<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OPERAVA MailDesk</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app-config.js"></script>
</head>
<body>
  <main id="mail-view" class="app-shell">
    <header class="topbar">
      <img src="/operava_exact_transparent.png" alt="OPERAVA" class="brand">
      <div><strong id="user-email"></strong> <button id="sign-out" type="button">Sign out</button></div>
    </header>
    <section class="mail-layout">
      <aside>
        <button id="compose" type="button">Compose</button>
        <nav>
          <button class="active" data-filter="all" type="button">All</button>
          <button data-filter="sent" type="button">Sent</button>
          <button data-filter="queued" type="button">Queued</button>
          <button data-filter="failed" type="button">Failed</button>
        </nav>
      </aside>
      <section class="mailbox-card">
        <div class="mailbox-heading"><h1>MailDesk</h1><span><span id="count">0</span> messages</span></div>
        <p id="mail-message" role="status"></p>
        <div id="email-list"><div class="empty">Loading secure mailbox…</div></div>
      </section>
    </section>
  </main>
  <section id="composer" class="composer" hidden>
    <form id="send-form">
      <div class="composer-heading"><h2>New message</h2><button id="close-compose" type="button" aria-label="Close">×</button></div>
      <label>To<input id="to" type="email" required></label>
      <label>Subject<input id="subject" maxlength="998" required></label>
      <label>Message<textarea id="html" rows="12" required></textarea></label>
      <button type="submit">Send</button>
    </form>
  </section>
  <script src="/app.js"></script>
</body>
</html>
