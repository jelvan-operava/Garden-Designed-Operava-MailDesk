-- Enable UUID
create extension if not exists "uuid-ossp";
create extension if not exists "pgcrypto";

-- ENUMS
do $$ begin
  create type email_status as enum ('inbox','sent','draft','outbox','trash','scheduled');
exception when duplicate_object then null;
end $$;
do $$ begin
  create type resend_event_type as enum ('sent','delivered','bounced','complained','opened','clicked');
exception when duplicate_object then null;
end $$;

-- PROFILES
create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text not null,
  name text,
  signature_html text default '',
  avatar_url text,
  created_at timestamptz default now()
);

-- FOLDERS
create table if not exists public.folders (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid not null references public.profiles(id) on delete cascade,
  name text not null,
  icon text default 'folder',
  color text default '#8B5CF6',
  created_at timestamptz default now()
);

-- EMAILS
create table if not exists public.emails (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid not null references public.profiles(id) on delete cascade,
  from_json jsonb not null,
  to_arr text[] not null,
  cc text[] default '{}',
  bcc text[] default '{}',
  subject text,
  body_html text,
  body_text text,
  snippet text,
  status email_status not null default 'inbox',
  read boolean default false,
  starred boolean default false,
  labels text[] default '{}',
  folder_id uuid references public.folders(id) on delete set null,
  has_attachments boolean default false,
  outbox_reason text,
  scheduled_at timestamptz,
  sent_at timestamptz,
  created_at timestamptz default now()
);
create index on public.emails (user_id, status);

import { createHmac } from 'node:crypto'; // use Web Crypto in Workers

// For Cloudflare Workers (Web Crypto):
async function verifySvixSignature(payload: string, headers: Headers, secret: string) {
  const svixId = headers.get('svix-id')!;
  const svixTimestamp = headers.get('svix-timestamp')!;
  const svixSignature = headers.get('svix-signature')!;

  // secret is base64 with whsec_ prefix stripped
  const secretBytes = Uint8Array.from(atob(secret.replace('whsec_','')), c => c.charCodeAt(0));
  const toSign = \`\${svixId}.\${svixTimestamp}.\${payload}\`;
  const key = await crypto.subtle.importKey('raw', secretBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(toSign));
  const expected = btoa(String.fromCharCode(...new Uint8Array(sig)));
  
  // svixSignature format: v1,base64
  const passedSigs = svixSignature.split(' ').map(s => s.split(',')[1]);
  return passedSigs.includes(expected);
}
