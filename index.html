<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPERAVA MailDesk</title><meta name="description" content="OPERAVA MailDesk secure email workspace"><link rel="stylesheet" href="app.css"></head>
<body><main class="shell"><section id="auth-view" class="auth-card"><p class="eyebrow">OPERAVA GLOBAL SOLUTIONS</p><h1>OPERAVA<br><em>MailDesk</em></h1><p class="muted">A calm, secure workspace for your delivery mailbox.</p><form id="login-form"><label>Work email<input id="email" type="email" autocomplete="email" required placeholder="you@operava.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="primary" type="submit">Sign in securely</button><p id="auth-message" class="message" role="status"></p></form><p class="hint">Your administrator controls access in Supabase Auth.</p></section>
<section id="mail-view" hidden><aside><div class="brand"><span>✦</span><div><b>OPERAVA MailDesk</b><small>garden · calm</small></div></div><button id="compose" class="primary">＋ Compose</button><nav><button class="active" data-filter="all">Inbox <span id="count">0</span></button><button data-filter="sent">Sent</button><button data-filter="failed">Outbox</button></nav><button id="sign-out" class="quiet">Sign out</button></aside><section class="workspace"><header><div><p class="eyebrow">YOUR MAILBOX</p><h2>Messages</h2></div><span id="user-email" class="user"></span></header><p id="mail-message" class="message" role="status"></p><div id="composer" class="composer" hidden><div class="compose-head"><b>New message</b><button id="close-compose" class="quiet">Close</button></div><form id="send-form"><label>To<input id="to" type="email" required placeholder="recipient@example.com"></label><label>Subject<input id="subject" required placeholder="What is this about?"></label><label>Message<textarea id="html" required placeholder="Write your message…"></textarea></label><button class="primary" type="submit">Send with Resend</button></form></div><div id="email-list" class="email-list" aria-live="polite"></div></section></section></main><script src="app-config.js"></script><script src="app.js"></script></body></html>
