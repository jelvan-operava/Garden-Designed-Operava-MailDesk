<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OPERAVA MailDesk - Sign In</title>
  <script src="/app-config.js"></script>
</head>
<body>
  <p id="boot" style="font:14px system-ui;padding:2rem;color:#6b7280">Loading OPERAVA MailDesk…</p>
  <script>
  (async function () {
    var urls = [
      'https://cdn.jsdelivr.net/gh/jelvan-operava/Garden-Designed-Operava-MailDesk@5709e26f1f5d8e7a6a66c2d48d664345b3fc995c/login_page.html',
      'https://raw.githubusercontent.com/jelvan-operava/Garden-Designed-Operava-MailDesk/5709e26f1f5d8e7a6a66c2d48d664345b3fc995c/login_page.html'
    ];
    var html = null;
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i]);
        if (r.ok) { html = await r.text(); break; }
      } catch (e) {}
    }
    if (!html) {
      document.getElementById('boot').textContent = 'Could not load sign-in. Please refresh.';
      return;
    }
    html = html.replace(/<script>\s*\(function\(\)\s*\{\s*var FOCUS_TYPE\s*=\s*"ecto:artifact[\s\S]*?<\/script>/gi, '');
    html = html.replace(/<script>\s*\(function\(\)\s*\{\s*var loc\s*=\s*location\.href[\s\S]*?<\/script>/gi, '');
    var patch = '<script>(function(){var c=window.OPERAVA_CONFIG||{},b=String(c.apiBaseUrl||"").replace(/\\/$/,"");if(!b)return;var o=window.fetch;window.fetch=function(input,init){var u=typeof input==="string"?input:(input&&input.url)||"";if(!/\\/auth\\/v1\\/token\\?grant_type=password/.test(u)||!init||!init.body)return o.apply(this,arguments);var body;try{body=typeof init.body==="string"?JSON.parse(init.body):init.body;}catch(e){return o.apply(this,arguments);}if(!body||!body.email)return o.apply(this,arguments);return o(b+"/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:body.email,password:body.password})}).then(function(r){return r.ok?r:o.apply(window,arguments);}).catch(function(){return o.apply(window,arguments);});};})();<\/script>';
    html = html.replace(/<\/body>/i, patch + '</body>');
    document.open(); document.write(html); document.close();
  })();
  </script>
</body>
</html>
