<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OPERAVA MailDesk - Sign In</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app-config.js"></script>
</head>
<body>
  <main id="auth-view" class="auth-shell">
    <section class="auth-card">
      <img src="/operava_exact_transparent.png" alt="OPERAVA" class="brand">
      <h1>MailDesk</h1>
      <p>Sign in with your OPERAVA account.</p>
      <form id="login-form">
        <label>Email<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="auth-message" role="status"></p>
    </section>
  </main>
  <script>
  (function () {
    const config = window.OPERAVA_CONFIG || {};
    const sessionKey = 'operava-maildesk-session';
    const status = document.getElementById('auth-message');
    const configured = config.supabaseUrl && !config.supabaseUrl.includes('YOUR_') && config.supabaseAnonKey && !config.supabaseAnonKey.includes('YOUR_');
    try {
      const current = JSON.parse(localStorage.getItem(sessionKey) || 'null');
      if (current && current.access_token) location.replace('/mailbox');
    } catch (_) { localStorage.removeItem(sessionKey); }
    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!configured) { status.textContent = 'Authentication is not configured.'; return; }
      status.textContent = 'Signing in…';
      try {
        const response = await fetch(config.supabaseUrl + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { apikey: config.supabaseAnonKey, 'content-type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await response.json();
        if (!response.ok || !data.access_token) { status.textContent = data.error_description || data.msg || 'Incorrect Password and Email'; return; }
        localStorage.setItem(sessionKey, JSON.stringify(data));
        location.replace('/mailbox');
      } catch (_) { status.textContent = 'Sign in service is unavailable.'; }
    });
  })();
  </script>
</body>
</html>
