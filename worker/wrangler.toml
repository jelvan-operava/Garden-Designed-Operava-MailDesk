name = "operava-maildesk-api"
main = "src/index.js"
compatibility_date = "2026-09-22"
workers_dev = true

# Production Cloudflare Workers AI binding.
# Runtime access: env.AI
[ai]
binding = "AI"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
# Non-secret production configuration.
# Keep the model identifier server-side so the browser cannot select arbitrary models.
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
ZEPTOMAIL_API_URL = "https://api.zeptomail.com/v1.1/email"
ZEPTOMAIL_FROM_NAME = "OPERAVA MailDesk"

# Optional Cloudflare D1 binding:
# [[d1_databases]]
# binding = "DB"
# database_name = "operava-maildesk-db"
# database_id = "your-d1-database-uuid"

# FRONTEND_URL is intentionally configured per deployment/environment
# (secret or environment-specific vars) as the exact CORS allowlist.
# Never commit ZEPTOMAIL_API_KEY, service-role, or auth secrets here.
